<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Phantom Power (48V)</title>
  <link rel="stylesheet" href="https://sdpi-components.dev/css/sdpi.css" />
  <script src="https://sdpi-components.dev/js/sdpi-components.js"></script>
</head>
<body>
  <sdpi-item label="Channel">
    <sdpi-select setting="channel">
      <option value="1">AN 1</option>
      <option value="2">AN 2</option>
      <option value="3">AN 3</option>
      <option value="4">AN 4</option>
      <option value="5">AN 5</option>
      <option value="6">AN 6</option>
      <option value="7">AN 7</option>
      <option value="8">AN 8</option>
      <option value="9">AN 9</option>
      <option value="10">AN 10</option>
      <option value="11">AN 11</option>
      <option value="12">AN 12</option>
    </sdpi-select>
  </sdpi-item>
  <details style="padding: 8px 16px; font-size: 11px; color: #9b9b9b;">
    <summary style="cursor: pointer;">Help</summary>
    <p>Channel numbers correspond to analog input channels in TotalMix FX.</p>
    <p>Requires TotalMix FX with OSC enabled (ports 7001/9001).</p>
  </details>
</body>
</html>
