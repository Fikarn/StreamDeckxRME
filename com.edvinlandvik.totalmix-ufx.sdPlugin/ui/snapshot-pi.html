<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Snapshot Recall</title>
  <link rel="stylesheet" href="https://sdpi-components.dev/css/sdpi.css" />
  <script src="https://sdpi-components.dev/js/sdpi-components.js"></script>
</head>
<body>
  <sdpi-item label="Snapshot">
    <sdpi-select setting="slot">
      <option value="1">Snapshot 1</option>
      <option value="2">Snapshot 2</option>
      <option value="3">Snapshot 3</option>
      <option value="4">Snapshot 4</option>
      <option value="5">Snapshot 5</option>
      <option value="6">Snapshot 6</option>
      <option value="7">Snapshot 7</option>
      <option value="8">Snapshot 8</option>
    </sdpi-select>
  </sdpi-item>
  <sdpi-item label="Label">
    <sdpi-textfield setting="label" placeholder="Recording Setup"></sdpi-textfield>
  </sdpi-item>
  <details style="padding: 8px 16px; font-size: 11px; color: #9b9b9b;">
    <summary style="cursor: pointer;">Help</summary>
    <p>Recalls a TotalMix FX snapshot (1-8). Use snapshots to switch entire routing configurations.</p>
    <p>Requires TotalMix FX with OSC enabled (ports 7001/9001).</p>
  </details>
</body>
</html>
